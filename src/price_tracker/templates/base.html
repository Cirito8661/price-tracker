<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}{{ page_title|default(settings.app_name) }}{% endblock %} · {{ settings.app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('dashboard') }}">
        <span class="brand-mark" aria-hidden="true">PT</span>
        <span>{{ settings.app_name }}</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="{{ url_for('dashboard') }}" class="nav-link{% if request.url.path == '/' %} active{% endif %}">Dashboard</a>
        <a href="{{ url_for('products_list') }}" class="nav-link{% if request.url.path.startswith('/products') %} active{% endif %}">Products</a>
        <a href="{{ url_for('settings') }}" class="nav-link{% if request.url.path == '/settings' %} active{% endif %}">Settings</a>
      </nav>
      <span class="local-badge">Local only</span>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>{{ settings.app_name }} v{{ settings.app_version }}</span>
    <span>Running locally on {{ settings.app_host }}:{{ settings.app_port }}</span>
  </footer>

  <script src="{{ url_for('static', path='vendor/htmx/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='vendor/chartjs/chart.umd.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</body>
</html>
