[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "price-tracker"
version = "0.1.0"
description = "Local web application for automated product price monitoring."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cirito8661" }]
keywords = ["price-tracker", "fastapi", "sqlalchemy", "playwright", "sqlite"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "fastapi>=0.162,<1.0",
    "uvicorn>=0.30,<1.0",
    "sqlalchemy>=2.0.57,<2.1",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.12,<1.0",
    "itsdangerous>=2.2,<3.0",
    "alembic>=1.13,<2.0",
    "apscheduler>=3.11,<4.0",
    "playwright>=1.55,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
    "httpx>=0.27,<1",
    "pip-audit>=2.7,<3",
    "types-beautifulsoup4>=4.12",
]

[project.scripts]
price-tracker = "price_tracker.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240", "S101", "S104", "S105", "S106", "S107"]

[tool.ruff.lint.isort]
known-first-party = ["price_tracker"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.coverage.run]
source = ["price_tracker"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
